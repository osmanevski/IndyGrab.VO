<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndyGrab.VO Mixer</title>
    <style>
        /* Tailwind CSS Temel Stilleri (Örnek) */
        @tailwind base;
        @tailwind components;
        @tailwind utilities;

        /* Tailwind Direktifleri İçin Basit Bir Yerel Stil */
        :root {
            --color-gray-100: #f1ebeb;
            --color-gray-900: #0d0d0f;
            --color-gray-800: #1b1b1f;
            --color-gray-700: #29292e;
            --color-gray-600: #514649;
            --color-gray-400: #b4a7a9;
            --color-gray-50: #242429;
            --color-blue-500: #60a5fa;
            --color-blue-600: #2563eb;
            --color-blue-700: #1d4ed8;
            --color-green-600: #3d74c9;
            --color-green-700: #28549b;
            --color-purple-600: #4e6290;
            --color-purple-700: #374563;
        }
:root {   }
:root[data-theme="light"] {   }
:root[data-theme="light"] h1, :root[data-theme="light"] h2, :root[data-theme="light"] h3, :root[data-theme="light"] th { color:#14161b; }
        :root[data-theme="light"] {
            color-scheme: light;
            --color-gray-100: #16181d;
            --color-gray-900: #f4f6f9;
            --color-gray-800: #ffffff;
            --color-gray-700: #eef1f6;
            --color-gray-600: rgba(20,24,33,.16);
            --color-gray-400: #5c6470;
            --color-gray-50: #e9ecf1;
            --color-blue-500: #2563eb;
            --color-blue-600: #1d4ed8;
            --color-blue-700: #1e40af;
            --color-green-600: #2563eb;
            --color-green-700: #1d4ed8;
            --color-purple-600: #4e6290;
            --color-purple-700: #374563;
        }

        /* Temel Tailwind Sınıfları */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .min-h-screen {
            min-height: 100vh;
        }

        .flex {
            display: flex;
        }

        .items-center {
            align-items: center;
        }

        .justify-center {
            justify-content: center;
        }

        .justify-between {
            justify-content: space-between;
        }

        .p-4 {
            padding: 1rem;
        }

        .p-6 {
            padding: 1.5rem;
        }

        .px-4 {
            padding-left: 1rem;
            padding-right: 1rem;
        }

        .py-2 {
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
        }

        .px-6 {
            padding-left: 1.5rem;
            padding-right: 1.5rem;
        }

        .w-full {
            width: 100%;
        }

        .max-w-2xl {
            max-width: 42rem;
        }

        .mb-4 {
            margin-bottom: 1rem;
        }

        .mb-6 {
            margin-bottom: 1.5rem;
        }

        .mt-4 {
            margin-top: 1rem;
        }

        .text-center {
            text-align: center;
        }

        .text-2xl {
            font-size: 1.5rem;
            line-height: 2rem;
        }

        .text-sm {
            font-size: 0.875rem;
            line-height: 1.25rem;
        }

        .font-bold {
            font-weight: 700;
        }

        .font-medium {
            font-weight: 500;
        }

        .border {
            border-width: 1px;
            border-style: solid;
        }

        .rounded-lg {
            border-radius: 0.5rem;
        }

        .shadow-lg {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .focus\:outline-none:focus {
            outline: none;
        }

        .focus\:ring-2:focus {
            --tw-ring-offset-width: 2px;
            --tw-ring-color: var(--color-blue-500);
            box-shadow: var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow, 0 0 #0000);
        }

        .focus\:ring-blue-500:focus {
            --tw-ring-color: var(--color-blue-500);
        }

        .transition {
            transition-property: all;
            transition-duration: 150ms;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }

        .duration-200 {
            transition-duration: 200ms;
        }

        .hidden {
            display: none;
        }

        .block {
            display: block;
        }

        .h-40 {
            height: 10rem;
        }

        .p-3 {
            padding: 0.75rem;
        }

        /* Renk Sınıfları */
        .bg-gray-100 {
            background-color: var(--color-gray-100);
        }

        .bg-gray-900 {
            background-color: var(--color-gray-900);
        }

        .bg-white {
            background-color: #ffffff;
        }

        .bg-gray-800 {
            background-color: var(--color-gray-800);
        }

        .bg-gray-50 {
            background-color: var(--color-gray-50);
        }

        .bg-gray-700 {
            background-color: var(--color-gray-700);
        }

        .bg-blue-600 {
            background-color: var(--color-blue-600);
        }

        .bg-blue-700 {
            background-color: var(--color-blue-700);
        }

        .bg-green-600 {
            background-color: var(--color-green-600);
        }

        .bg-green-700 {
            background-color: var(--color-green-700);
        }

        .bg-purple-600 {
            background-color: var(--color-purple-600);
        }

        .bg-purple-700 {
            background-color: var(--color-purple-700);
        }

        .text-gray-900 {
            color: var(--color-gray-900);
        }

        .text-gray-100 {
            color: var(--color-gray-100);
        }

        .text-gray-600 {
            color: var(--color-gray-600);
        }

        .text-gray-400 {
            color: var(--color-gray-400);
        }

        .text-white {
            color: #ffffff;
        }

        /* Karanlık Mod Stilleri */
        .dark\:bg-gray-900 {
            background-color: var(--color-gray-900);
        }

        .dark\:bg-gray-800 {
            background-color: var(--color-gray-800);
        }

        .dark\:bg-gray-700 {
            background-color: var(--color-gray-700);
        }

        .dark\:text-gray-100 {
            color: var(--color-gray-100);
        }

        .dark\:text-gray-400 {
            color: var(--color-gray-400);
        }

        .dark\:border-gray-600 {
            border-color: var(--color-gray-600);
        }

        /* Hover Efektleri */
        .hover\:bg-blue-700:hover {
            background-color: var(--color-blue-700);
        }

        .hover\:bg-green-700:hover {
            background-color: var(--color-green-700);
        }

        .hover\:bg-purple-700:hover {
            background-color: var(--color-purple-700);
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-2xl p-6 bg-white dark:bg-gray-800 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold text-center text-gray-900 dark:text-gray-100 mb-6">IndyGrab.VO Mixer</h1>
        <p class="text-center text-gray-600 dark:text-gray-400 mb-4">Enter your ASIN list below, one per line, to shuffle and remove duplicates.</p>

        <div class="mb-4">
            <label for="inputAsins" class="block text-sm font-medium text-gray-900 dark:text-gray-100 mb-2">Input ASINs</label>
            <textarea id="inputAsins" class="w-full p-4 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-gray-100 h-40" placeholder="Enter ASINs here..."></textarea>
        </div>

        <div class="mb-4 text-center">
            <button id="mixButton" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500">Mix ASINs</button>
        </div>

        <div class="mb-4">
            <label for="outputAsins" class="block text-sm font-medium text-gray-900 dark:text-gray-100 mb-2">Shuffled ASINs</label>
            <textarea id="outputAsins" class="w-full p-4 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-gray-100 h-40" readonly></textarea>
        </div>

        <div class="flex justify-between">
            <button id="copyButton" class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500" disabled>Copy to Clipboard</button>
            <button id="downloadButton" class="px-6 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500" disabled>Download as TXT</button>
        </div>

        <div class="mt-4">
            <button id="duplicatesButton" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500" disabled>Show Duplicates</button>
            <div id="duplicatesList" class="hidden mt-4 p-4 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-gray-100">
                <strong>Removed duplicates</strong>
                <ul id="duplicatesContent"></ul>
            </div>
        </div>

        <p id="notification" class="text-center text-sm text-gray-600 dark:text-gray-400 mt-4 hidden"></p>
    </div>
    <script src="theme.js"></script>
    <script src="mixer.js"></script>
</body>
</html>
