<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>IndyGrab.VO</title>
    <script src="theme.js"></script>
    <script src="launcher.js" defer></script>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0a0b0d; --surface: #16171b; --surface-soft: #1f2025;
            --border: rgba(210,190,192,.16); --text: #f4eeee; --muted: #a9abb2;
            --primary: #2563eb; --primary-light: #60a5fa;
        }
        :root[data-theme="light"] {
            color-scheme: light;
            --bg: #f4f6f9; --surface: #ffffff; --surface-soft: #eef1f6;
            --border: rgba(20,24,33,.12); --text: #16181d; --muted: #5c6470;
            --primary: #2563eb; --primary-light: #1d4ed8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 320px; padding: 16px; background: var(--bg); color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .wordmark { height: 26px; display: block; }
        #theme-toggle {
            width: 30px; height: 30px; border-radius: 9px; cursor: pointer; font-size: 14px; line-height: 1;
            background: var(--surface-soft); border: 1px solid var(--border); color: var(--text);
        }
        .status {
            display: flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 600;
            background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
            padding: 8px 11px; margin-bottom: 12px;
        }
        #auto-dot { width: 7px; height: 7px; border-radius: 50%; background: #8b95a5; flex: none; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
        .stat {
            background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
            padding: 10px 6px; text-align: center;
        }
        .stat b { display: block; font-size: 17px; color: var(--primary-light); line-height: 1.2; }
        .stat span { font-size: 9.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
        .primary-btn {
            display: block; width: 100%; padding: 13px; border: none; border-radius: 11px; cursor: pointer;
            background: linear-gradient(135deg, var(--primary), #1747b5); color: #fff;
            font-size: 14px; font-weight: 700; margin-bottom: 10px; transition: transform .15s;
        }
        .primary-btn:hover { transform: translateY(-1px); }
        .links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .links button {
            padding: 9px 4px; border-radius: 9px; cursor: pointer; font-size: 11.5px; font-weight: 600;
            background: var(--surface-soft); border: 1px solid var(--border); color: var(--text);
            transition: transform .15s, border-color .2s;
        }
        .links button:hover { transform: translateY(-1px); border-color: var(--primary); }
        .hint { margin-top: 12px; font-size: 10.5px; color: var(--muted); text-align: center; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="head">
        <img class="wordmark" src="assets/wordmark-indygrabvo.png" alt="IndyGrab.VO">
        <button id="theme-toggle" title="Aydınlık moda geç">☀️</button>
    </div>

    <div class="status">
        <span id="auto-dot"></span><span id="auto-state">Beklemede</span>
    </div>

    <div class="stats">
        <div class="stat"><b id="stat-stores">0</b><span>Mağaza</span></div>
        <div class="stat"><b id="stat-products">0</b><span>Ürün</span></div>
        <div class="stat"><b id="stat-asins">0</b><span>ASIN</span></div>
    </div>

    <button class="primary-btn" data-open="research.html">🚀 Kontrol Panelini Aç</button>

    <div class="links">
        <button data-open="titles.html">AI Başlık</button>
        <button data-open="blacklist.html">Kara Liste</button>
        <button data-open="mixer.html">Mixer</button>
    </div>

    <p class="hint">Toplama, filtre ve hafıza yönetimi<br>Kontrol Paneli → <b>Amazon Paneli</b> sekmesinde.</p>
</body>
</html>
