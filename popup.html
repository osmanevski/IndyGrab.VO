<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndyGrab.VO</title>
    <script src="popup.js" defer></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            width: 360px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            padding: 15px;
            color: #1a202c;
            border-radius: 8px;
            transition: background 0.3s ease, color 0.3s ease;
        }
        body {
            background: #1a202c;
            color: #e2e8f0;
        }
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
            gap: 5px;
        }
        .brand-logo {
            color: #2563a8;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            line-height: 1;
        }
        .brand-logo .brand-suffix {
            color: #1a202c;
            font-weight: 700;
        }
        body .brand-logo {
            color: #63b3ed;
        }
        body .brand-logo .brand-suffix {
            color: #e2e8f0;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .language-selector {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
        }
        .flag-container {
            display: flex;
            gap: 8px;
        }
        .language-selector img {
            width: 24px;
            height: 24px;
            cursor: pointer;
            border-radius: 4px;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .language-selector img.selected {
            opacity: 1;
            transform: scale(1.1);
            border: 1px solid #2b6cb0;
        }
        .language-selector img:not(.selected) {
            opacity: 0.5;
        }
        .language-selector img:hover {
            opacity: 0.8;
            transform: scale(1.05);
        }
        .links-container {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .mixer-btn, .blacklist-btn, .stock-btn, .auto-btn {
            padding: 2px 6px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #fff;
            background: #2e3b54;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s ease, transform 0.1s ease;
            text-decoration: none;
            display: inline-block;
        }
        .mixer-btn:hover, .blacklist-btn:hover, .stock-btn:hover, .auto-btn:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }
        body .mixer-btn, body .blacklist-btn, 
        body .stock-btn, body .auto-btn {
            background: #3f5a8f;
        }
        body .mixer-btn:hover, body .blacklist-btn:hover, 
        body .stock-btn:hover, body .auto-btn:hover {
            background: #173166;
        }
        .tab-container {
            display: flex;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 15px;
        }
        body .tab-container {
            border-bottom: 1px solid #4a5568;
        }
        .tab {
            flex: 1;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            background: #edf2f7;
            color: #718096;
            font-weight: 500;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }
        body .tab {
            background: #2d3748;
            color: #a0aec0;
        }
        .tab.active {
            background: #fff;
            color: #1a202c;
            font-weight: 600;
            border-bottom: 2px solid #2b6cb0;
        }
        body .tab.active {
            background: #1a202c;
            color: #e2e8f0;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        details {
            margin-bottom: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            background: #fff;
            overflow: hidden;
        }
        body details {
            border: 1px solid #4a5568;
            background: #2d3748;
        }
        summary {
            padding: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #1a202c;
            cursor: pointer;
            list-style: none;
            display: flex;
            align-items: center;
            background: #edf2f7;
            transition: background 0.2s ease;
        }
        body summary {
            color: #e2e8f0;
            background: #2d3748;
        }
        details[open] summary {
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 8px;
        }
        body details[open] summary {
            border-bottom: 1px solid #4a5568;
        }
        details > div {
            padding: 8px;
            animation: slideDown 0.3s ease-out;
        }
        .summary-icon {
            display: inline-block;
            width: 16px;
            text-align: center;
            margin-right: 8px;
            transition: transform 0.2s ease;
        }
        details[open] .summary-icon {
            transform: rotate(45deg);
        }
        summary:hover {
            background: #e2e8f0;
        }
        body summary:hover {
            background: #4a5568;
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        label {
            display: block;
            font-size: 0.8rem;
            color: #1a202c;
            margin-bottom: 5px;
            font-weight: 500;
        }
        body label {
            color: #e2e8f0;
        }
        select, input {
            width: 100%;
            padding: 6px;
            margin-bottom: 8px;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            font-size: 0.8rem;
            background: #fff;
            color: #1a202c;
            transition: border-color 0.2s ease, background 0.3s ease, color 0.3s ease;
        }
        body select,
        body input {
            background: #2d3748;
            color: #e2e8f0;
            border: 1px solid #4a5568;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #2b6cb0;
        }
        h4 {
            font-size: 0.85rem;
            color: #2b6cb0;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid #e2e8f0;
        }
        body h4 {
            color: #63b3ed;
            border-bottom-color: #4a5568;
        }
        hr {
            border: none;
            border-top: 1px solid #e2e8f0;
            margin: 12px 0;
        }
        body hr {
            border-top-color: #4a5568;
        }
        .flex-container {
            display: flex;
            gap: 8px;
        }
        .flex-container input {
            width: 50%;
        }
        .flex-container-inline {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .flex-container-inline div {
            flex: 1;
        }
        .flex-container-inline input, 
        .flex-container-inline select {
            width: 100%;
        }
        textarea {
            width: 100%;
            height: 70px;
            font-size: 0.8rem;
            padding: 6px;
            margin-bottom: 8px;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            background: #fff;
            resize: none;
            color: #1a202c;
            transition: border-color 0.2s ease, background 0.3s ease, color 0.3s ease;
        }
        body textarea {
            background: #2d3748;
            color: #e2e8f0;
            border: 1px solid #4a5568;
        }
        button {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            transition: background 0.2s ease;
        }
        #saveToMemoryBtn {
            background: #2b6cb0;
            color: white;
        }
        #saveToMemoryBtn:hover {
            background: #2c5282;
        }
        #copyAllBtn {
            background: #2563eb;
            color: white;
        }
        #copyAllBtn:hover {
            background: #1d4ed8;
        }
        #mixMemoryBtn {
            background: #2563eb;
            color: white;
        }
        #mixMemoryBtn:hover {
            background: #1d4ed8;
        }
        #exportCsvBtn {
            background: #059669;
            color: white;
        }
        #exportCsvBtn:hover {
            background: #047857;
        }
        #exportJsonBtn {
            background: #059669;
            color: white;
        }
        #exportJsonBtn:hover {
            background: #047857;
        }
        #clearMemoryBtn {
            background: #dc2626;
            color: white;
        }
        #clearMemoryBtn:hover {
            background: #b91c1c;
        }
        .memory-buttons {
            display: flex;
            gap: 8px;
        }
        .memory-buttons button {
            flex: 1;
            padding: 6px;
            font-size: 0.75rem;
        }
        .notification {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }
        .notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        #memory p {
            font-size: 0.75rem;
            color: #718096;
            margin-bottom: 8px;
            text-align: center;
        }
        body #memory p {
            color: #a0aec0;
        }
        .export-history {
            margin-top: 12px;
        }
        .export-history h3 {
            font-size: 0.8rem;
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 8px;
        }
        body .export-history h3 {
            color: #e2e8f0;
        }
        .export-history ul {
            list-style: none;
            max-height: 120px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            padding: 4px;
        }
        body .export-history ul {
            border: 1px solid #4a5568;
        }
        .export-history li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px;
            font-size: 0.75rem;
            color: #1a202c;
            border-bottom: 1px solid #e2e8f0;
        }
        body .export-history li {
            color: #e2e8f0;
            border-bottom: 1px solid #4a5568;
        }
        .export-history li:last-child {
            border-bottom: none;
        }
        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        .history-details {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .history-details span {
            display: inline-block;
        }
        .history-details .type-asin {
            font-weight: 500;
            min-width: 80px;
        }
        .history-details .custom-date {
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .history-details .custom-date input {
            width: 100%;
            padding: 2px 4px;
            font-size: 0.75rem;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            background: #fff;
            color: #1a202c;
            box-sizing: border-box;
        }
        body .history-details .custom-date input {
            background: #2d3748;
            color: #e2e8f0;
            border: 1px solid #4a5568;
        }
        body .history-details .custom-date input:focus {
            border-color: #63b3ed;
            outline: none;
        }
        .history-actions {
            display: flex;
            gap: 4px;
        }
        .history-icon {
            width: 14px;
            height: 14px;
            cursor: pointer;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .history-icon:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }
        .how-to-use-link {
            font-size: 0.7rem;
            color: #2b6cb0;
            text-decoration: none;
            font-weight: 500;
        }
        body .how-to-use-link {
            color: #63b3ed;
        }
        .how-to-use-link:hover {
            text-decoration: underline;
        }
        .asin-list {
            width: 100%;
            max-height: 70px;
            overflow-y: auto;
            font-size: 0.8rem;
            padding: 6px;
            margin-bottom: 8px;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            background: #fff;
            color: #1a202c;
            transition: border-color 0.2s ease, background 0.3s ease, color 0.3s ease;
            line-height: 1.2;
        }
        body .asin-list {
            background: #2d3748;
            color: #e2e8f0;
            border: 1px solid #4a5568;
        }
        .asin-list a {
            color: #2b6cb0;
            text-decoration: none;
            display: block;
            margin: 0;
            padding: 2px 0;
        }
        .asin-list a:hover {
            text-decoration: underline;
        }
        body .asin-list a {
            color: #63b3ed;
        }
        .asin-list:empty::before {
            content: "No ASINs found.";
            color: #718096;
            font-size: 0.8rem;
        }
        body .asin-list:empty::before {
            color: #a0aec0;
        }
        .update-container {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-bottom: 8px;
        }
        .update-icon {
            cursor: pointer;
            width: 20px;
            height: 20px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .update-icon:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }
        #stopAutoBtn {
            display: none;
        }
        .auto-collect-section {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
        }
        body .auto-collect-section {
            border-bottom: 1px solid #4a5568;
        }
        .feature-toggle-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e2e8f0;
        }
        body .feature-toggle-section {
            border-top: 1px solid #4a5568;
        }
        .feature-toggle {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }
        .feature-toggle input[type="checkbox"] {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #e2e8f0;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            transition: background 0.3s ease, border-color 0.3s ease;
            margin-right: 8px;
        }
        body .feature-toggle input[type="checkbox"] {
            border-color: #4a5568;
        }
        .feature-toggle input[type="checkbox"]:checked {
            background: #2b6cb0;
            border-color: #2b6cb0;
        }
        .feature-toggle input[type="checkbox"]:checked::before {
            content: "✓";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 12px;
        }
        .feature-toggle label {
            font-size: 0.8rem;
            color: #1a202c;
            font-weight: 500;
        }
        body .feature-toggle label {
            color: #e2e8f0;
        }
        .asin-row {
            display: flex;
            align-items: center;
            margin-bottom: 2px;
            font-size: 12px;
        }
        .delete-icon {
            width: 12px;
            height: 12px;
            margin-right: 4px;
            cursor: pointer;
        }
        .asin-column {
            width: 100px;
            display: inline-block;
            margin-right: 4px;
        }
        .asin-column a {
            color: #0066c0;
            text-decoration: none;
        }
        .asin-column a:hover {
            text-decoration: underline;
        }
        .asin-row {
            color: #fff;
        }
        .asin-column a {
            color: #66b0ff;
        }
        .delete-icon {
            filter: brightness(0) invert(1);
        }
        .banned-words-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .banned-words-controls > div {
            flex: 1;
        }
        .banned-words-add-container {
            display: flex;
        }
        .banned-words-add-container input {
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
            margin-bottom: 0;
        }
        .banned-words-add-container button {
            flex-shrink: 0;
            width: auto;
            padding: 6px 12px;
            margin-top: 0;
            background: #2b6cb0;
            color: white;
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
        }
         .banned-words-add-container button:hover {
            background: #2c5282;
        }
        #searchBannedWordInput {
            margin-bottom: 0;
        }
        #bannedWordsContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            min-height: 40px;
            max-height: 70px;
            overflow-y: auto;
            margin-bottom: 8px;
        }
        body #bannedWordsContainer {
            border-color: #4a5568;
        }
        .banned-word-tag {
            background: #e2e8f0;
            color: #4a5568;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }
        body .banned-word-tag {
            background: #4a5568;
            color: #e2e8f0;
        }
        .remove-word-btn {
            cursor: pointer;
            font-weight: bold;
            color: #718096;
            line-height: 1;
        }
        .remove-word-btn:hover {
            color: #1a202c;
        }
        body .remove-word-btn {
            color: #a0aec0;
        }
        body .remove-word-btn:hover {
            color: #fff;
        }
        .banned-words-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: -4px;
            margin-bottom: 8px;
        }
        #copyBannedWordsBtn {
            width: auto;
            padding: 4px 10px;
            font-size: 0.75rem;
            background: #3182ce;
            color: white;
            margin: 0;
        }
        #copyBannedWordsBtn:hover {
            background: #2b6cb0;
        }
        #bannedWordCount {
            font-size: 0.75rem;
            color: #718096;
        }
        body #bannedWordCount {
            color: #a0aec0;
        }
        /* IndyGrab.VO charcoal / crimson palette */
        :root { --ink: #0a0b0d; --panel: #1b1c20; --panel-raised: #292a2f; --line: #47484f; --text: #f1f2f4; --muted: #a9abb2; --blue: #2563eb; --blue-light: #60a5fa; --blue-deep: #1d4ed8; --crimson: #8d2b35; --crimson-deep: #641b24; }
        body { background: var(--ink); color: var(--text); }
        body .brand-logo { color: var(--blue-light); }
        .brand-logo { display: flex; align-items: flex-end; justify-content: center; gap: 5px; }
        .brand-wordmark { width: 214px; height: auto; display: block; }
        .language-selector img.selected { border-color: var(--blue-light); }
        body .mixer-btn, body .blacklist-btn, body .stock-btn, body .auto-btn { background: #292a2f; border: 1px solid #41434a; }
        body .mixer-btn:hover, body .blacklist-btn:hover, body .stock-btn:hover, body .auto-btn:hover { background: #363840; border-color: #5b8edc; }
        body .tab-container, body hr { border-color: var(--line); }
        body .tab, body details, body select, body input, body textarea, body .asin-list, body .auto-collect-section, body .feature-toggle-section { background: var(--panel); color: var(--text); border-color: var(--line); }
        body .tab { color: var(--muted); }
        body .tab.active { background: #24252a; color: var(--text); border-bottom-color: var(--blue-light); }
        body summary { color: var(--text); }
        body summary:hover { color: #cbdcff; }
        body input:focus, body select:focus, body textarea:focus { border-color: var(--blue-light); box-shadow: 0 0 0 2px rgba(96, 165, 250, .16); }
        button { background-color: #303137 !important; border: 1px solid #45464d !important; }
        button:hover:not(:disabled) { background-color: #3a3c43 !important; border-color: #5d6069 !important; }
        #updateBtn, #saveToMemoryBtn, #copyAllBtn, #exportCsvBtn, #exportJsonBtn, #mixMemoryBtn, #addBannedWordBtn, #copyBannedWordsBtn, #startAutoBtn { background-color: var(--blue) !important; border-color: #4d85ef !important; }
        #updateBtn:hover, #saveToMemoryBtn:hover, #copyAllBtn:hover, #exportCsvBtn:hover, #exportJsonBtn:hover, #mixMemoryBtn:hover, #addBannedWordBtn:hover, #copyBannedWordsBtn:hover, #startAutoBtn:hover { background-color: var(--blue-deep) !important; }
        #stopAutoBtn, #clearMemoryBtn, #sendToBlacklistBtn { background-color: var(--crimson) !important; border-color: #bd5962 !important; }
        #stopAutoBtn:hover, #clearMemoryBtn:hover, #sendToBlacklistBtn:hover { background-color: var(--crimson-deep) !important; }
        body a, body .asin-column a { color: #8bb9ff; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="language-selector">
            <div class="flag-container">
                <img src="images/us.png" alt="US Flag" data-lang="en" class="lang-flag selected">
                <img src="images/tr.png" alt="TR Flag" data-lang="tr" class="lang-flag">
            </div>
        </div>
        <div class="links-container">
            <a href="mixer.html" target="_blank" class="mixer-btn">Mixer</a>
            <a href="blacklist.html" target="_blank" class="blacklist-btn">Blacklist</a>
            <a href="titles.html" target="_blank" class="stock-btn">AI Başlık</a>
            <a href="research.html" target="_blank" class="auto-btn">AI Araştırma</a>
        </div>
    </div>

    <div class="logo-container">
        <div class="brand-logo" aria-label="IndyGrab.VO"><img class="brand-wordmark" src="assets/wordmark-indygrabvo.png" alt="IndyGrab.VO"></div>
    </div>

    <div class="tab-container">
        <div class="tab active" data-tab="collect" data-i18n="tab_collect">Collect</div>
        <div class="tab" data-tab="filtering" data-i18n="tab_filter">Filter</div>
        <div class="tab" data-tab="memory" data-i18n="tab_memory">Memory</div>
    </div>

    <div id="notification" class="notification"></div>

    <div id="collect" class="tab-content active">
        <div class="update-container">
            <img src="images/update-icon.png" alt="Refresh ASINs" class="update-icon" id="updateBtn" title="Refresh ASINs">
            <img src="images/start-auto-icon.png" alt="Start Auto Collect" class="update-icon" id="startAutoBtn" title="Start Auto Collect">
            <img src="images/stop-auto-icon.png" alt="Stop Auto Collect" class="update-icon" id="stopAutoBtn" title="Stop Auto Collect">
        </div>
        <div id="asinOutput" class="asin-list"></div>
        <button id="saveToMemoryBtn" data-i18n="save_to_memory">Save to Memory (0 ASIN)</button>
    </div>

    <div id="filtering" class="tab-content">
        <details>
            <summary>
                <span class="summary-icon">+</span>
                <span data-i18n="auto_collect">Auto Collect Settings</span>
            </summary>
            <div>
                <div class="flex-container-inline">
                    <div>
                        <label for="autoPageLimit" data-i18n="auto_page_limit">Number of Pages to Navigate:</label>
                        <input type="number" id="autoPageLimit" min="1" placeholder="E.g., 10">
                    </div>
                    <div>
                        <label for="autoAsinLimit" data-i18n="auto_asin_limit">Total ASINs to Collect:</label>
                        <input type="number" id="autoAsinLimit" min="1" placeholder="E.g., 100">
                    </div>
                </div>
            </div>
        </details>

        <details>
            <summary>
                <span class="summary-icon">+</span>
                <span data-i18n="tab_filter">Normal Filters</span>
            </summary>
            <div>
                <label for="ratingFilter" data-i18n="feedback_stars">Feedback Stars:</label>
                <select id="ratingFilter">
                    <option value="" selected disabled>Select...</option>
                    <option value="1" data-i18n="stars_1">1 Star and above</option>
                    <option value="2" data-i18n="stars_2">2 Stars and above</option>
                    <option value="3" data-i18n="stars_3">3 Stars and above</option>
                    <option value="4" data-i18n="stars_4">4 Stars and above</option>
                    <option value="4.1" data-i18n="stars_4_1">4.1 Stars and above</option>
                    <option value="4.2" data-i18n="stars_4_2">4.2 Stars and above</option>
                    <option value="4.3" data-i18n="stars_4_3">4.3 Stars and above</option>
                    <option value="4.4" data-i18n="stars_4_4">4.4 Stars and above</option>
                    <option value="4.5" data-i18n="stars_4_5">4.5 Stars and above</option>
                    <option value="4.6" data-i18n="stars_4_6">4.6 Stars and above</option>
                    <option value="4.7" data-i18n="stars_4_7">4.7 Stars and above</option>
                    <option value="4.8" data-i18n="stars_4_8">4.8 Stars and above</option>
                    <option value="4.9" data-i18n="stars_4_9">4.9 Stars and above</option>
                    <option value="5" data-i18n="stars_5">5 Stars and above</option>
                </select>

                <label data-i18n="banned_words">Banned Words:</label>
                <div class="banned-words-controls">
                    <div class="banned-words-add-container">
                        <input type="text" id="bannedWordInput" placeholder="Add word(s)...">
                        <button id="addBannedWordBtn">Add</button>
                    </div>
                    <div>
                        <input type="text" id="searchBannedWordInput" placeholder="Search word...">
                    </div>
                </div>
                <div id="bannedWordsContainer"></div>
                <div class="banned-words-footer">
                    <button id="copyBannedWordsBtn">Copy Words</button>
                    <span id="bannedWordCount">0 words</span>
                </div>

                <label data-i18n="feedback_score">Feedback Score:</label>
                <div class="flex-container">
                    <input type="number" id="feedbackFilter" min="0" placeholder="Min">
                    <input type="number" id="maxFeedbackFilter" min="0" placeholder="Max">
                </div>

                <label data-i18n="price_range">Price Range:</label>
                <div class="flex-container">
                    <input type="number" id="minPriceFilter" min="0" placeholder="Min">
                    <input type="number" id="maxPriceFilter" min="0" placeholder="Max">
                </div>

                <label data-i18n="max_bsr">Max Deep BSR:</label>
                <div class="flex-container">
                    <input type="number" id="maxBsrFilter" min="1" placeholder="Max BSR">
                </div>

                <div class="flex-container-inline">
                    <div>
                        <label for="asinCount" data-i18n="asin_count">Number of ASINs to Fetch:</label>
                        <input type="number" id="asinCount" min="1" placeholder="E.g., 10">
                    </div>
                    <div>
                        <label for="shippingFilter" data-i18n="shipping_selection">Shipping Selection:</label>
                        <select id="shippingFilter">
                            <option value="" selected disabled>Select...</option>
                            <option value="all" data-i18n="shipping_all">All Products</option>
                            <option value="prime" data-i18n="shipping_prime">Prime Only</option>
                            <option value="1-day" data-i18n="shipping_1day">1-Day Shipping</option>
                            <option value="2-day" data-i18n="shipping_2day">2-Day Shipping</option>
                        </select>
                    </div>
                </div>

                <div class="flex-container-inline">
                    <div>
                        <label for="stockFilter" data-i18n="min_stock_count">Minimum Stock Count:</label>
                        <select id="stockFilter">
                            <option value="" selected disabled>Select...</option>
                            <option value="ignore" data-i18n="stock_ignore">Ignore Stock Filter</option>
                            <option value="exclude_warning" data-i18n="stock_exclude_warning">Exclude Stock Warning</option>
                            <option value="1" data-i18n="stock_1">At least 1 stock</option>
                            <option value="2" data-i18n="stock_2">At least 2 stock</option>
                            <option value="3" data-i18n="stock_3">At least 3 stock</option>
                            <option value="4" data-i18n="stock_4">At least 4 stock</option>
                            <option value="5" data-i18n="stock_5">At least 5 stock</option>
                            <option value="6" data-i18n="stock_6">At least 6 stock</option>
                            <option value="7" data-i18n="stock_7">At least 7 stock</option>
                            <option value="8" data-i18n="stock_8">At least 8 stock</option>
                            <option value="9" data-i18n="stock_9">At least 9 stock</option>
                            <option value="10" data-i18n="stock_10">At least 10 stock</option>
                            <option value="11" data-i18n="stock_11">At least 11 stock</option>
                            <option value="12" data-i18n="stock_12">At least 12 stock</option>
                            <option value="13" data-i18n="stock_13">At least 13 stock</option>
                            <option value="14" data-i18n="stock_14">At least 14 stock</option>
                            <option value="15" data-i18n="stock_15">At least 15 stock</option>
                            <option value="16" data-i18n="stock_16">At least 16 stock</option>
                            <option value="17" data-i18n="stock_17">At least 17 stock</option>
                            <option value="18" data-i18n="stock_18">At least 18 stock</option>
                            <option value="19" data-i18n="stock_19">At least 19 stock</option>
                            <option value="20" data-i18n="stock_20">At least 20 stock</option>
                        </select>
                    </div>
                    <div>
                        <label for="sortFilter" data-i18n="sort_order">Sort Order:</label>
                        <select id="sortFilter">
                            <option value="" selected disabled>Select...</option>
                            <option value="random" data-i18n="sort_random">Random</option>
                            <option value="priceLowToHigh" data-i18n="sort_price_low_to_high">Price: Low to High</option>
                            <option value="priceHighToLow" data-i18n="sort_price_high_to_low">Price: High to Low</option>
                            <option value="feedbackLowToHigh" data-i18n="sort_feedback_low_to_high">Feedback Score: Low to High</option>
                            <option value="feedbackHighToLow" data-i18n="sort_feedback_high_to_low">Feedback Score: High to Low</option>
                            <option value="bsrLowToHigh" data-i18n="sort_bsr_low_to_high">BSR: Best to Worst (1...)</option>
                        </select>
                    </div>
                </div>
            </div>
        </details>

        <details> <summary>
                <span class="summary-icon">+</span>
                <span data-i18n="feature_toggles">Amazon Features</span>
            </summary>
            <div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <div class="feature-toggle">
                        <input type="checkbox" id="toggleStock" checked>
                        <label for="toggleStock" data-i18n="toggle_stock">Stock Quantity</label>
                    </div>
                    <div class="feature-toggle">
                        <input type="checkbox" id="togglePrime" checked>
                        <label for="togglePrime" data-i18n="toggle_prime">Prime Indicator</label>
                    </div>
                    <div class="feature-toggle">
                        <input type="checkbox" id="toggleRating" checked>
                        <label for="toggleRating" data-i18n="toggle_rating">Rating/Feedback</label>
                    </div>
                    <div class="feature-toggle">
                        <input type="checkbox" id="toggleBannedWarning" checked>
                        <label for="toggleBannedWarning" data-i18n="toggle_banned_warning">Banned Word Warning</label>
                    </div>
                    <div class="feature-toggle">
                        <input type="checkbox" id="toggleCopyIcon" checked>
                        <label for="toggleCopyIcon" data-i18n="toggle_copy_icon">Copy Icon</label>
                    </div>
                    <div class="feature-toggle">
                        <input type="checkbox" id="toggleSaveIcon" checked>
                        <label for="toggleSaveIcon" data-i18n="toggle_save_icon">Save Icon</label>
                    </div>
                    <div class="feature-toggle">
                        <input type="checkbox" id="toggleEbayIcon" checked>
                        <label for="toggleEbayIcon" data-i18n="toggle_ebay_icon">eBay Search Icon</label>
                    </div>
                </div>
                <div style="margin-top: 10px;">
                    <label for="bsrDisplayMode" data-i18n="toggle_bsr_display">BSR Display Mode</label>
                    <select id="bsrDisplayMode">
                        <option value="general" data-i18n="bsr_general">General</option>
                        <option value="deep" data-i18n="bsr_deep">Deep</option>
                    </select>
                </div>
                </div>
        </details>
        
        <details>
            <summary>
                <span class="summary-icon">+</span>
                <span data-i18n="ebay_features">eBay Features</span>
            </summary>
            <div>
                <h4 data-i18n="ebay_chart_settings">Chart Settings (/itm/)</h4>
                <label for="ebayChartDefaultDays" data-i18n="ebay_default_range">Default Date Range:</label>
                <select id="ebayChartDefaultDays">
                    <option value="7" data-i18n="ebay_days_7">Last 7 Days</option>
                    <option value="14" data-i18n="ebay_days_14">Last 14 Days</option>
                    <option value="30" data-i18n="ebay_days_30">Last 30 Days</option>
                </select>
        
                <label for="ebayChartDisplay" data-i18n="ebay_data_display">Data to Display:</label>
                <select id="ebayChartDisplay">
                    <option value="both" data-i18n="ebay_display_both">Quantity & Customers</option>
                    <option value="quantity" data-i18n="ebay_display_quantity">Quantity Only</option>
                    <option value="customers" data-i18n="ebay_display_customers">Customers Only</option>
                </select>
                
                <hr>
        
                <h4 data-i18n="ebay_sch_settings">Search Page Settings (/sch/)</h4>
                
                <label for="schDisplayMode" data-i18n="ebay_sch_display_mode">Data Display Mode:</label>
                <select id="schDisplayMode" style="margin-bottom: 12px;">
                    <option value="standard" data-i18n="ebay_sch_mode_standard">Standard (Info + Breakdown Button)</option>
                    <option value="direct" data-i18n="ebay_sch_mode_direct">Direct Sales Breakdown</option>
                </select>

                <label for="schSellerSaleDays" data-i18n="ebay_sch_seller_sale_days_label">Last Sale Date Filter (Days):</label>
                <input type="number" id="schSellerSaleDays" min="1" data-i18n-placeholder="ebay_sch_seller_sale_days_placeholder" placeholder="e.g., 7 (for last 7 days)">

                <label data-i18n="ebay_sch_range">Date Ranges to Show:</label>
                <div style="margin-bottom: 8px;">
                    <div class="feature-toggle">
                        <input type="checkbox" id="schDisplay7Days">
                        <label for="schDisplay7Days" data-i18n="ebay_days_7">Last 7 Days</label>
                    </div>
                    <div class="feature-toggle">
                        <input type="checkbox" id="schDisplay14Days">
                        <label for="schDisplay14Days" data-i18n="ebay_days_14">Last 14 Days</label>
                    </div>
                    <div class="feature-toggle">
                        <input type="checkbox" id="schDisplay30Days">
                        <label for="schDisplay30Days" data-i18n="ebay_days_30">Last 30 Days</label>
                    </div>
                </div>
        
                <label for="schDataDisplay" data-i18n="ebay_data_display">Data to Display:</label>
                <select id="schDataDisplay" style="margin-bottom: 12px;">
                    <option value="both" data-i18n="ebay_display_both">Quantity & Customers</option>
                    <option value="quantity" data-i18n="ebay_display_quantity">Quantity Only</option>
                    <option value="customers" data-i18n="ebay_display_customers">Customers Only</option>
                </select>

                <label data-i18n="ebay_sch_info">Info to Show:</label>
                 <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
                    <div class="feature-toggle">
                        <input type="checkbox" id="schDisplaySold">
                        <label for="schDisplaySold" data-i18n="ebay_sch_sold">Sold</label>
                    </div>
                    <div class="feature-toggle">
                        <input type="checkbox" id="schDisplayWatchers">
                        <label for="schDisplayWatchers" data-i18n="ebay_sch_watchers">Watchers</label>
                    </div>
                    <div class="feature-toggle">
                        <input type="checkbox" id="schDisplayAvailable">
                        <label for="schDisplayAvailable" data-i18n="ebay_sch_available">Available</label>
                    </div>
                </div>
            </div>
        </details>
    </div>

    <div id="memory" class="tab-content">
        <p data-i18n="memory_limit">Memory Limit: 20000 ASIN</p>
        <div id="memoryOutput" class="asin-list"></div>
        <div id="memoryPagination" style="display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; align-items: center;"></div>
        
        <div class="memory-buttons">
            <button id="copyAllBtn" data-i18n="copy_all">Copy All (0 ASIN)</button>
            <button id="mixMemoryBtn" data-i18n="shuffle">Shuffle</button>
        </div>
        <div class="memory-buttons">
            <button id="exportCsvBtn" data-i18n="export_csv">Export as CSV</button>
            <button id="exportJsonBtn" data-i18n="export_json">Export as JSON</button>
        </div>
        
        <button id="sendToBlacklistBtn" style="background-color: #34495e; color: white; margin-bottom: 5px;" data-i18n="send_to_blacklist">Send to Blacklist</button>
        
        <button id="clearMemoryBtn" data-i18n="clear_memory">Clear Memory</button>

        <div class="export-history">
            <h3 data-i18n="export_history">Export History</h3>
            <ul id="exportHistoryList"></ul>
        </div>
    </div>
</body>
</html>
